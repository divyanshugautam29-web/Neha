<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Neha My Bacha ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff85a2; --bg: #0a0a0c; --glass: rgba(255, 255, 255, 0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        .romantic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(10,10,12,0.9)),
                        url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=2070');
            background-size: cover; background-position: center; z-index: -1;
            animation: slowZoom 25s infinite alternate;
        }
        @keyframes slowZoom { from {transform: scale(1);} to {transform: scale(1.05);} }

        /* Splash Screen */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; transition: 1s ease;
        }
        .heart-btn {
            background: none; border: 2px solid var(--accent); color: var(--accent);
            padding: 18px 45px; font-size: 16px; border-radius: 50px;
            cursor: pointer; letter-spacing: 3px; font-weight: 600;
            box-shadow: 0 0 30px rgba(255,133,162,0.3); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }

        /* Content Layout */
        .container {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding: 20px; padding-bottom: 160px; overflow-y: auto;
        }

        .neha-msg { font-family: 'Dancing Script', cursive; font-size: 2.8rem; color: var(--accent); margin-top: 20px; text-shadow: 0 0 15px rgba(255,133,162,0.5); }

        /* Playlist Styles */
        .playlist {
            width: 100%; max-width: 450px; margin-top: 30px;
            background: var(--glass); border-radius: 25px;
            padding: 15px; border: 1px solid rgba(255,255,255,0.1);
        }
        .song-item {
            display: flex; align-items: center; padding: 12px 15px;
            border-radius: 15px; margin-bottom: 8px; cursor: pointer;
            transition: 0.3s; border: 1px solid transparent;
        }
        .song-item:hover { background: rgba(255,255,255,0.05); }
        .song-item.active { background: rgba(255,133,162,0.15); border-color: var(--accent); }
        .song-item .idx { width: 30px; font-size: 12px; color: var(--accent); }
        .song-item .name { flex: 1; font-size: 14px; font-weight: 400; }

        /* Bottom Player Bar */
        .player-bar {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 20px; padding-bottom: 30px; z-index: 1000;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Progress Bar (Seek) */
        .seek-container { width: 100%; display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; height: 4px; }
        .time-label { font-size: 10px; color: #888; width: 35px; }

        .main-controls { display: flex; align-items: center; gap: 30px; }
        .btn { background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; }
        .play-btn { width: 60px; height: 60px; background: var(--accent); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; }

        /* Volume Control */
        .volume-box { display: flex; align-items: center; gap: 10px; margin-top: 15px; width: 150px; }
        .volume-box span { font-size: 14px; }

        #yt-player { position: absolute; top: -1000px; left: -1000px; }
    </style>
</head>
<body>

    <div id="splash">
        <p style="color: var(--accent); margin-bottom: 25px; font-family: 'Dancing Script'; font-size: 28px;">For Neha my bacha...</p>
        <button class="heart-btn" id="start-btn" onclick="startExperience()" disabled>Loading Vibes...</button>
    </div>

    <div class="romantic-bg"></div>

    <div class="container">
        <h1 class="neha-msg">Neha my bacha</h1>
        <p style="font-size: 10px; letter-spacing: 5px; color: #777; text-transform: uppercase;">Divyanshu Playlist</p>

        <div class="playlist" id="playlist-container">
            <!-- Playlist items will be generated here -->
        </div>
    </div>

    <!-- Fixed Player Bar -->
    <div class="player-bar">
        <div id="current-track-name" style="font-size: 12px; color: var(--accent); margin-bottom: 10px; font-weight: 500;">Select a song</div>
        
        <div class="seek-container">
            <span class="time-label" id="time-curr">0:00</span>
            <input type="range" id="seek-bar" value="0" min="0" max="100">
            <span class="time-label" id="time-total">0:00</span>
        </div>

        <div class="main-controls">
            <button class="btn" onclick="changeTrack(-1)">⏮</button>
            <button class="btn play-btn" id="play-trigger" onclick="togglePlay()">⏵</button>
            <button class="btn" onclick="changeTrack(1)">⏭</button>
        </div>

        <div class="volume-box">
            <span>🔈</span>
            <input type="range" id="volume-bar" min="0" max="100" value="80">
            <span>🔊</span>
        </div>
    </div>

    <div id="yt-player"></div>

    <script>
        const songs = [
            { id: '2eliQ_KR8yA', name: 'Dil Ibadat' },
            { id: 'kyqJ_FId-_w', name: 'Zara Sa' },
            { id: 'LmBsyzzX5aA', name: 'Tum Mile' },
            { id: 'vJQCAtzSfuo', name: 'Tu Hi Meri Shab Hai' },
            { id: '-8C_2BBVWk8', name: 'Hale Dil' },
            { id: 'j18MRhEfmPk', name: 'Phir Mohabbat' },
            { id: 'CKJA9blyMUg', name: 'Mat Aazma Re' },
            { id: 'OJixIQFF-wA', name: 'Tujhe Sochta Hoon' },
            { id: 'hm-cYTDo5dA', name: 'Tujh Mein Rab Dikhta Hai' },
            { id: 'nGWnCIvEJV0', name: 'Sang Hoon Tere' }
        ];
        
        let trackIdx = 0;
        let player;
        let isPlaying = false;
        let isReady = false;

        // Render Playlist
        const playlistContainer = document.getElementById('playlist-container');
        songs.forEach((song, index) => {
            const item = document.createElement('div');
            item.className = 'song-item';
            item.id = `song-${index}`;
            item.innerHTML = `<span class="idx">${index + 1}</span><span class="name">${song.name}</span><span>❤️</span>`;
            item.onclick = () => playSpecificSong(index);
            playlistContainer.appendChild(item);
        });

        // Load YouTube API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0',
                videoId: songs[trackIdx].id,
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1, 'rel': 0 },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onStateChange
                }
            });
        }

        function onPlayerReady() {
            isReady = true;
            document.getElementById('start-btn').innerText = "START VIBES ❤️";
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').classList.add('ready-pulse');
            setupMediaSession();
        }

        function startExperience() {
            if(isReady) {
                playSpecificSong(0);
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => { document.getElementById('splash').style.display = 'none'; }, 1000);
            }
        }

        function onStateChange(event) {
            const btn = document.getElementById('play-trigger');
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                btn.innerText = "⏸";
                updateMediaMetadata();
            } else {
                isPlaying = false;
                btn.innerText = "⏵";
                if(event.data == YT.PlayerState.ENDED) changeTrack(1);
            }
        }

        function togglePlay() {
            isPlaying ? player.pauseVideo() : player.playVideo();
        }

        function playSpecificSong(index) {
            trackIdx = index;
            player.loadVideoById(songs[trackIdx].id);
            updatePlaylistUI();
            document.getElementById('current-track-name').innerText = songs[trackIdx].name;
        }

        function changeTrack(dir) {
            trackIdx = (trackIdx + dir + songs.length) % songs.length;
            playSpecificSong(trackIdx);
        }

        function updatePlaylistUI() {
            document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`song-${trackIdx}`).classList.add('active');
        }

        // Seeking Logic
        const seekBar = document.getElementById('seek-bar');
        seekBar.oninput = function() {
            const seekTo = (player.getDuration() * (seekBar.value / 100));
            player.seekTo(seekTo);
        };

        // Volume Logic
        const volumeBar = document.getElementById('volume-bar');
        volumeBar.oninput = function() {
            player.setVolume(volumeBar.value);
        };

        function formatTime(time) {
            const min = Math.floor(time / 60);
            const sec = Math.floor(time % 60);
            return `${min}:${sec < 10 ? '0' + sec : sec}`;
        }

        setInterval(() => {
            if (player && isPlaying && player.getCurrentTime) {
                const curr = player.getCurrentTime();
                const dur = player.getDuration();
                document.getElementById('time-curr').innerText = formatTime(curr);
                document.getElementById('time-total').innerText = formatTime(dur);
                seekBar.value = (curr / dur) * 100;
            }
        }, 1000);

        // Media Session API for Lock Screen
        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', () => player.playVideo());
                navigator.mediaSession.setActionHandler('pause', () => player.pauseVideo());
                navigator.mediaSession.setActionHandler('previoustrack', () => changeTrack(-1));
                navigator.mediaSession.setActionHandler('nexttrack', () => changeTrack(1));
            }
        }

        function updateMediaMetadata() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: songs[trackIdx].name,
                    artist: 'Neha my bacha ❤️',
                    artwork: [{ src: 'https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=512', sizes: '512x512', type: 'image/jpeg' }]
                });
            }
        }
    </script>
</body>
</html>
