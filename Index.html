<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Neha My Bacha ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff85a2; --bg-fallback: #1a0a0f; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-fallback); 
            color: #fff; 
            font-family: 'Poppins', sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            text-align: center;
        }

        /* Romantic Background with Fallback Color */
        .romantic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(26, 10, 15, 0.5), rgba(10, 10, 12, 0.9)),
                        url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?q=80&w=2070');
            background-size: cover; background-position: center; z-index: -1;
            animation: slowZoom 20s infinite alternate;
        }

        @keyframes slowZoom { from {transform: scale(1);} to {transform: scale(1.05);} }

        /* Splash Screen (Parda) */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }

        .heart-btn {
            background: none; border: 2px solid var(--accent); color: var(--accent);
            padding: 18px 45px; font-size: 16px; border-radius: 50px;
            cursor: pointer; letter-spacing: 3px; font-weight: 600;
            box-shadow: 0 0 30px rgba(255,133,162,0.4); animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.1);} 100% {transform: scale(1);} }

        .neha-msg { 
            font-family: 'Dancing Script', cursive; 
            font-size: clamp(2.5rem, 10vw, 3.5rem); 
            color: var(--accent); 
            margin-bottom: 10px; 
            text-shadow: 0 0 20px rgba(255,133,162,0.6); 
        }

        .player-card {
            width: 85%; max-width: 400px; 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border-radius: 35px; padding: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .play-btn { background: none; border: none; color: var(--accent); font-size: 70px; cursor: pointer; line-height: 1; }

        /* Hidden YouTube */
        #yt-player { position: absolute; top: -1000px; visibility: hidden; }
    </style>
</head>
<body>

    <!-- Splash Screen: Black Parda -->
    <div id="splash">
        <p style="color: var(--accent); margin-bottom: 30px; font-family: 'Dancing Script'; font-size: 28px;">For Neha my bacha...</p>
        <button class="heart-btn" onclick="openWeb()">START MUSIC ❤️</button>
        <p style="color: #444; margin-top: 40px; font-size: 11px; letter-spacing: 3px;">TAP TO UNLOCK LOVE</p>
    </div>

    <div class="romantic-bg"></div>

    <div style="z-index: 10;">
        <h1 class="neha-msg">Neha my bacha</h1>
        <p style="font-size: 10px; letter-spacing: 5px; color: #ccc; margin-bottom: 30px; text-transform: uppercase;">Pehle se bhi zyada...</p>
        
        <div class="player-card">
            <button class="play-btn" id="main-play" onclick="toggle()">⏵</button>
            <p style="margin-top: 15px; font-size: 12px; color: var(--accent); letter-spacing: 2px;">Listening with you...</p>
        </div>
    </div>

    <div id="yt-player"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player, isPlaying = false;
        
        // YouTube API Load
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0',
                videoId: 'gTfC1AZ6Mqo',
                playerVars: { 'playsinline': 1, 'rel': 0, 'controls': 0 }
            });
        }

        // Start Experience
        function openWeb() {
            const splash = document.getElementById('splash');
            splash.style.opacity = '0';
            setTimeout(() => { 
                splash.style.display = 'none'; 
                player.playVideo();
                isPlaying = true;
                document.getElementById('main-play').innerText = '⏸';
            }, 1000);
        }

        // Toggle Music
        function toggle() {
            const btn = document.getElementById('main-play');
            if (isPlaying) {
                player.pauseVideo();
                btn.innerText = '⏵';
            } else {
                player.playVideo();
                btn.innerText = '⏸';
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
