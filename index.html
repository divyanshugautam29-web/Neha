<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Neha My Bacha ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff85a2; --bg: #0a0a0c; --glass: rgba(255, 255, 255, 0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Romantic Background */
        .romantic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #1a0a0f, #0a0a0c), 
                        url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?auto=format&fit=crop&q=80&w=1000');
            background-size: cover; background-position: center; z-index: -1;
            animation: slowZoom 25s infinite alternate;
        }
        @keyframes slowZoom { from {transform: scale(1);} to {transform: scale(1.05);} }

        /* Splash Screen */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; transition: 0.5s ease;
        }
        .heart-btn {
            background: none; border: 2px solid var(--accent); color: var(--accent);
            padding: 18px 45px; font-size: 16px; border-radius: 50px;
            cursor: pointer; letter-spacing: 3px; font-weight: 600;
            box-shadow: 0 0 30px rgba(255,133,162,0.3); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }

        /* Playlist Container */
        .container {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding: 20px; padding-bottom: 220px; overflow-y: auto;
        }

        .neha-msg { font-family: 'Dancing Script', cursive; font-size: 2.8rem; color: var(--accent); margin-top: 20px; text-shadow: 0 0 15px rgba(255,133,162,0.5); text-align: center;}

        .playlist {
            width: 100%; max-width: 450px; margin-top: 30px;
            background: var(--glass); border-radius: 25px;
            padding: 10px; border: 1px solid rgba(255,255,255,0.1);
        }
        .song-item {
            display: flex; align-items: center; padding: 12px 15px;
            border-radius: 15px; margin-bottom: 8px; cursor: pointer; transition: 0.2s;
        }
        .song-item.active { background: rgba(255,133,162,0.2); border: 1px solid var(--accent); }
        .song-item .idx { width: 30px; font-size: 12px; color: var(--accent); }
        .song-item .name { flex: 1; font-size: 13px; font-weight: 400; }

        /* Player Bar */
        .player-bar {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255,255,255,0.15);
            padding: 15px 20px 25px 20px; z-index: 1000;
            display: flex; flex-direction: column; align-items: center;
        }

        .seek-container { width: 100%; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; max-width: 500px; }
        input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; height: 4px; }
        .time-label { font-size: 10px; color: #888; width: 35px; text-align: center; }

        .main-controls { display: flex; align-items: center; gap: 25px; margin-bottom: 10px;}
        .btn { background: none; border: none; color: #fff; font-size: 26px; }
        .play-btn { width: 55px; height: 55px; background: var(--accent); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; }

        .volume-box { display: flex; align-items: center; gap: 10px; width: 130px; opacity: 0.6; }

        #yt-player { position: absolute; top: -1000px; left: -1000px; visibility: hidden; }

        /* Custom Scrollbar */
        .container::-webkit-scrollbar { width: 5px; }
        .container::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="splash">
        <p style="color: var(--accent); margin-bottom: 25px; font-family: 'Dancing Script'; font-size: 28px;">For Neha my bacha...</p>
        <button class="heart-btn" id="start-btn" onclick="startExperience()">START MUSIC ❤️</button>
    </div>

    <div class="romantic-bg"></div>

    <div class="container">
        <h1 class="neha-msg">Neha my bacha</h1>
        <p style="font-size: 10px; letter-spacing: 5px; color: #777; text-transform: uppercase; text-align: center;">Divyanshu Full Playlist</p>

        <div class="playlist" id="playlist-container">
            <!-- 15 Songs will be injected here -->
        </div>
    </div>

    <div class="player-bar">
        <div id="current-track-name" style="font-size: 12px; color: var(--accent); margin-bottom: 12px; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Select a song</div>
        
        <div class="seek-container">
            <span class="time-label" id="time-curr">0:00</span>
            <input type="range" id="seek-bar" value="0" min="0" max="100">
            <span class="time-label" id="time-total">0:00</span>
        </div>

        <div class="main-controls">
            <button class="btn" onclick="changeTrack(-1)">⏮</button>
            <button class="btn play-btn" id="play-trigger" onclick="togglePlay()">⏵</button>
            <button class="btn" onclick="changeTrack(1)">⏭</button>
        </div>

        <div class="volume-box">
            <span>🔈</span>
            <input type="range" id="volume-bar" min="0" max="100" value="80">
            <span>🔊</span>
        </div>
    </div>
