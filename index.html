<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>90s & Romantic | Divyanshu Gautam</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@1,600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff85a2; --vintage: #d4a373; --bg: #0a0a0c; --glass: rgba(255, 255, 255, 0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Cinematic Background */
        .romantic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), #0a0a0c), 
                        url('https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&q=80&w=1000');
            background-size: cover; background-position: center; z-index: -1;
            filter: sepia(20%); animation: slowZoom 30s infinite alternate;
        }
        @keyframes slowZoom { from {transform: scale(1);} to {transform: scale(1.05);} }

        /* Splash Screen */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex;
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        .enter-btn {
            background: none; border: 2px solid var(--accent); color: var(--accent);
            padding: 15px 40px; font-size: 16px; border-radius: 50px;
            cursor: pointer; letter-spacing: 4px; font-weight: 600;
            box-shadow: 0 0 30px rgba(255,133,162,0.2); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }

        /* Main Container Layout */
        .main-content {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding: 20px; padding-bottom: 200px; overflow-y: auto; scroll-behavior: smooth;
        }

        .header-title { font-family: 'Playfair Display', serif; font-style: italic; font-size: 2.2rem; color: var(--accent); text-shadow: 0 0 15px rgba(255,133,162,0.4); text-align: center; }
        .dev-name { font-size: 10px; letter-spacing: 3px; color: var(--vintage); text-transform: uppercase; margin-bottom: 30px; }

        /* Playlist UI */
        .playlist-box {
            width: 100%; max-width: 450px; background: var(--glass);
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); padding: 10px;
        }
        .song-item {
            display: flex; align-items: center; padding: 12px 15px; border-radius: 12px;
            cursor: pointer; transition: 0.3s; margin-bottom: 5px;
        }
        .song-item:hover { background: rgba(255,255,255,0.05); }
        .song-item.active { background: rgba(255,133,162,0.2); border: 1px solid var(--accent); }
        .song-item .idx { width: 30px; font-size: 12px; color: var(--vintage); }
        .song-item .name { flex: 1; font-size: 13px; font-weight: 400; }

        /* Bottom Player Bar */
        .player-bar {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255,255,255,0.15);
            padding: 15px 20px 25px 20px; z-index: 1000;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Seek Bar (Aage-Piche) */
        .seek-container { width: 100%; max-width: 600px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; height: 4px; }
        .time-label { font-size: 10px; color: #888; width: 35px; text-align: center; }

        /* Main Controls */
        .controls { display: flex; align-items: center; gap: 25px; margin-bottom: 15px; }
        .btn { background: none; border: none; color: #fff; font-size: 26px; cursor: pointer; }
        .play-btn { width: 55px; height: 55px; background: var(--accent); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; }

        /* Volume Box */
        .volume-container { display: flex; align-items: center; gap: 10px; width: 140px; opacity: 0.7; }
        .volume-container span { font-size: 14px; }

        #yt-player { position: absolute; top: -1000px; left: -1000px; visibility: hidden; }
        .main-content::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash">
        <p style="color: var(--accent); margin-bottom: 25px; font-family: 'Dancing Script'; font-size: 28px;">90s Romantic Mixtape</p>
        <button class="enter-btn" onclick="startExperience()">ENTER ❤️</button>
        <p style="color: #444; margin-top: 30px; font-size: 10px; letter-spacing: 2px;">DEVELOPED BY DIVYANSHU GAUTAM</p>
    </div>

    <div class="romantic-bg"></div>

    <div class="main-content">
        <h1 class="header-title">90s & Romantic</h1>
        <p class="dev-name">Divyanshu Gautam</p>

        <div class="playlist-box" id="playlist-container">
            <!-- Playlist Items will be injected by JavaScript -->
        </div>
    </div>

    <!-- Fixed Player Bar -->
    <div class="player-bar">
        <div id="current-song-title" style="font-size: 11px; color: var(--accent); margin-bottom: 10px; font-weight: 500; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px;">Select a song</div>
        
        <!-- Seek Control (Aage Piche) -->
        <div class="seek-container">
            <span class="time-label" id="curr-time">0:00</span>
            <input type="range" id="seek-bar" value="0" min="0" max="100">
            <span class="time-label" id="total-time">0:00</span>
        </div>

        <div class="controls">
            <button class="btn" onclick="changeTrack(-1)">⏮</button>
            <button class="btn play-btn" id="play-trigger" onclick="togglePlay()">⏵</button>
            <button class="btn" onclick="changeTrack(1)">⏭</button>
        </div>

        <!-- Volume Control -->
        <div class="volume-container">
            <span>🔈</span>
            <input type="range" id="volume-bar" min="0" max="100" value="80">
            <span>🔊</span>
        </div>
    </div>

    <div id="yt-player"></div>

    <script>
        // Playlist Data
        const songs = [
            { id: 'ON6qVMlxqqI', name: '90s Romantic Hits' },
            { id: '2eliQ_KR8yA', name: 'Dil Ibadat - Vibes' },
            { id: 'wsflx5Zr5p4', name: 'I Love You - Bodyguard' },
            { id: 'kyqJ_FId-_w', name: 'Zara Sa - Jannat' },
            { id: 'LmBsyzzX5aA', name: 'Tum Mile - Title Track' },
            { id: 'vJQCAtzSfuo', name: 'Tu Hi Meri Shab Hai' },
            { id: 'j18MRhEfmPk', name: 'Phir Mohabbat - Murder 2' },
            { id: '-8C_2BBVWk8', name: 'Hale Dil - Murder 2' },
            { id: 'gTfC1AZ6Mqo', name: 'Pehle Se Bhi Zyada' },
            { id: 'CKJA9blyMUg', name: 'Mat Aazma Re' }
        ];
        
        let trackIdx = 0, player, isPlaying = false, isReady = false;

        // Render Playlist
        const container = document.getElementById('playlist-container');
        songs.forEach((song, index) => {
            const item = document.createElement('div');
            item.className = 'song-item';
            item.id = `song-${index}`;
            item.innerHTML = `<span class="idx">${index + 1}</span><span class="name">${song.name}</span><span style="color:var(--accent)">❤️</span>`;
            item.onclick = () => playSpecificSong(index);
            container.appendChild(item);
        });

        // Load YouTube API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0', videoId: songs[trackIdx].id,
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1, 'rel': 0 },
                events: { 'onReady': () => { isReady = true; }, 'onStateChange': onPlayerStateChange }
            });
        }

        function startExperience() {
            const splash = document.getElementById('splash');
            splash.style.opacity = '0';
            setTimeout(() => { splash.style.display = 'none'; }, 600);
            if(isReady) playSpecificSong(0);
        }

        function onPlayerStateChange(event) {
            const btn = document.getElementById('play-trigger');
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true; btn.innerText = "⏸";
                updateMediaSession();
            } else {
                isPlaying = false; btn.innerText = "⏵";
                if(event.data == YT.PlayerState.ENDED) changeTrack(1);
            }
        }

        function togglePlay() {
            if(!player) return;
            isPlaying ? player.pauseVideo() : player.playVideo();
        }

        function playSpecificSong(index) {
            trackIdx = index;
            if(player && player.loadVideoById) {
                player.loadVideoById(songs[trackIdx].id);
                document.getElementById('current-song-title').innerText = songs[trackIdx].name;
                updatePlaylistUI();
            }
        }

        function changeTrack(dir) {
            trackIdx = (trackIdx + dir + songs.length) % songs.length;
            playSpecificSong(trackIdx);
        }

        function updatePlaylistUI() {
            document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`song-${trackIdx}`).classList.add('active');
        }

        // --- SEEK CONTROL (Aage-Piche) ---
        const seekBar = document.getElementById('seek-bar');
        seekBar.oninput = function() {
            const duration = player.getDuration();
            const seekTo = duration * (seekBar.value / 100);
            player.seekTo(seekTo);
        };

        // --- VOLUME CONTROL ---
        const volumeBar = document.getElementById('volume-bar');
        volumeBar.oninput = function() {
            player.setVolume(volumeBar.value);
        };

        function formatTime(time) {
            const min = Math.floor(time / 60);
            const sec = Math.floor(time % 60);
            return `${min}:${sec < 10 ? '0' + sec : sec}`;
        }

        // Progress Update Loop
        setInterval(() => {
            if (player && isPlaying && player.getCurrentTime) {
                const curr = player.getCurrentTime();
                const dur = player.getDuration();
                document.getElementById('curr-time').innerText = formatTime(curr);
                document.getElementById('total-time').innerText = formatTime(dur);
                seekBar.value = (curr / dur) * 100;
            }
        }, 1000);

        // Media Session (Lock Screen Controls)
        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: songs[trackIdx].name,
                    artist: 'Divyanshu Gautam',
                    artwork: [{ src: 'https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&q=80&w=512', sizes: '512x512', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
                navigator.mediaSession.setActionHandler('previoustrack', () => changeTrack(-1));
                navigator.mediaSession.setActionHandler('nexttrack', () => changeTrack(1));
            }
        }
    </script>
</body>
</html>
