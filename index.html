<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Neha My Bacha ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff85a2; --bg: #0a0a0c; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; 
            height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; overflow: hidden;
        }

        /* Romantic Cinematic Background */
        .romantic-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(10,10,12,0.9)),
                        url('https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?q=80&w=2070');
            background-size: cover; background-position: center; z-index: -1;
            animation: slowZoom 20s infinite alternate;
        }
        @keyframes slowZoom { from {transform: scale(1);} to {transform: scale(1.05);} }

        /* Splash Screen (Parda) */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; transition: 0.8s ease;
        }

        .heart-btn {
            background: none; border: 2px solid var(--accent); color: var(--accent);
            padding: 18px 45px; font-size: 16px; border-radius: 50px;
            cursor: pointer; letter-spacing: 3px; font-weight: 600;
            box-shadow: 0 0 30px rgba(255,133,162,0.4); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.1);} 100% {transform: scale(1);} }

        /* Header Message */
        .neha-msg { font-family: 'Dancing Script', cursive; font-size: 3rem; color: var(--accent); margin-bottom: 5px; text-shadow: 0 0 15px rgba(255,133,162,0.5); }
        .sub-tag { font-size: 10px; letter-spacing: 5px; color: #aaa; margin-bottom: 40px; text-transform: uppercase; }

        /* Music Visualizer (Spinning Heart) */
        .visual { font-size: 80px; margin-bottom: 30px; }
        .spinning { animation: spin 4s linear infinite; display: inline-block; }
        @keyframes spin { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }

        /* Glassmorphism Player Bar */
        .player-bar {
            width: 90%; max-width: 400px; background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 35px; padding: 25px; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center;
        }

        .track-info { font-size: 12px; color: var(--accent); margin-bottom: 15px; letter-spacing: 2px; height: 18px; }
        .controls { display: flex; justify-content: space-evenly; align-items: center; }
        .btn { background: none; border: none; color: #fff; font-size: 35px; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.9); }
        .play-btn { font-size: 60px; color: var(--accent); }

        .progress-box { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 25px; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

        /* Hidden YouTube */
        #yt-player { position: absolute; top: -1000px; visibility: hidden; }
    </style>
</head>
<body>

    <!-- Splash Screen -->
